<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora</title>
  <style>
    :root { color-scheme: dark; --bg: #0A0C11; --panel: #12151C; --line: #343B4B; --ink: #F4F6FA; --muted: #8A93A8; --brand: #8F82FF; --accent: #4CD9E8; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { display: grid; grid-template-rows: 46px 1fr 68px; overflow: hidden; }
    header { display: flex; align-items: center; gap: 14px; padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .mark { color: var(--brand); font-weight: 700; letter-spacing: .14em; }
    .path { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .spacer { flex: 1; }
    button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 4px; padding: 8px 11px; font: inherit; font-size: 11px; cursor: pointer; }
    button:hover, button:focus-visible { color: var(--ink); border-color: var(--brand); outline: none; }
    main { min-height: 0; padding: 18px; overflow: auto; }
    #output { min-height: 100%; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); font-size: 13px; line-height: 1.6; tab-size: 2; }
    .empty { color: var(--muted); }
    form { display: flex; gap: 10px; padding: 12px 18px; background: var(--panel); border-top: 1px solid var(--line); }
    input { min-width: 0; flex: 1; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 12px; font: inherit; font-size: 13px; }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
    .send { min-width: 92px; color: var(--bg); background: var(--brand); border-color: var(--brand); font-weight: 700; }
    .send:hover, .send:focus-visible { color: var(--bg); background: #AAA0FF; }
    #status { color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <span class="mark">NEXORA</span>
    <span id="project" class="path">CLI connecté</span>
    <span class="spacer"></span>
    <span id="status">démarrage…</span>
    <button id="choose" type="button">Projet</button>
  </header>
  <main id="viewport"><pre id="output"><span class="empty">La sortie du CLI apparaîtra ici…</span></pre></main>
  <form id="composer">
    <input id="prompt" autocomplete="off" placeholder="Écris une instruction pour le CLI…" aria-label="Instruction CLI">
    <button class="send" type="submit">Envoyer</button>
  </form>
  <script>
    const output = document.getElementById('output')
    const viewport = document.getElementById('viewport')
    const prompt = document.getElementById('prompt')
    const status = document.getElementById('status')
    const project = document.getElementById('project')
    const stripAnsi = (value) => value.replace(/[\\u001B\\u009B][[\\]()#;?]*(?:(?:(?:[a-zA-Z\\d]*(?:;[-a-zA-Z\\d/#&.:=?%@~_]+)*)?\\u0007)|(?:(?:\\d{1,4}(?:;\\d{0,4})*)?[\\dA-PR-TZcf-nq-uy=><~]))/g, '')
    const append = (data) => {
      if (output.querySelector('.empty')) output.textContent = ''
      output.textContent += stripAnsi(data)
      viewport.scrollTop = viewport.scrollHeight
    }
    window.nexoraDesktop.onOutput(append)
    window.nexoraDesktop.onExit(({ exitCode }) => { status.textContent = `CLI arrêté (${exitCode})` })
    document.getElementById('composer').addEventListener('submit', (event) => {
      event.preventDefault()
      const value = prompt.value.trim()
      if (!value) return
      window.nexoraDesktop.write(value + '\\r')
      prompt.value = ''
      prompt.focus()
    })
    document.getElementById('choose').addEventListener('click', async () => {
      const dir = await window.nexoraDesktop.chooseProject()
      if (dir) project.textContent = dir
    })
    const resize = () => {
      const cols = Math.floor(Math.max(40, viewport.clientWidth) / 8)
      const rows = Math.floor(Math.max(12, viewport.clientHeight) / 21)
      window.nexoraDesktop.resize(cols, rows)
    }
    new ResizeObserver(resize).observe(viewport)
    resize()
    status.textContent = 'CLI actif'
    prompt.focus()
  </script>
</body>
</html>
